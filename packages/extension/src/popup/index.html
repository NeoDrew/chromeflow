<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromeflow</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --card: #ffffff;
      --card-active: #eff6ff;
      --border: #e5e7eb;
      --border-active: #bfdbfe;
      --text: #111827;
      --text-muted: #4b5563;
      --text-faint: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --neutral: #9ca3af;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: auto !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      width: 320px;
      min-height: 0;
      height: auto;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .wordmark {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }
    .status-pill .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    .status-pill.idle .pill-dot { display: none; }

    .group { margin-bottom: 16px; }
    .group:last-of-type { margin-bottom: 0; }
    /* Static section label — "This window" */
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      padding: 4px 0;
      margin-bottom: 8px;
      cursor: default;
      user-select: none;
    }
    /* Collapsible dropdown — "Other windows", "Unassigned" */
    .group-header:not(.static) {
      font-size: 13px;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .group-header:not(.static):hover {
      background: #eef0f3;
      border-color: #d4d8de;
    }
    .group-header:not(.static):active {
      background: #e6e9ee;
    }
    .group-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .group-count {
      background: var(--bg);
      color: var(--text-muted);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      border: 1px solid var(--border);
    }
    .group-header.static .group-count {
      background: var(--bg-subtle);
      border: none;
    }
    .group-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      font-size: 21px;
      line-height: 1;
      color: var(--text-muted);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .group.collapsed .group-toggle { transform: rotate(-90deg); }
    .group-body {
      overflow: hidden;
    }
    .group.collapsed .group-body {
      display: none;
    }

    /* View transitions — animate cards moving between groups when assignment changes.
       Each card carries a unique view-transition-name (set inline per port). When the
       DOM is re-rendered inside document.startViewTransition, the browser snapshots
       each named element before and after, then interpolates position/size between
       them — producing a smooth slide for reassignments without any layout-math. */
    @media (prefers-reduced-motion: no-preference) {
      ::view-transition-group(*) {
        animation-duration: 0.32s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.18s;
      }
    }

    .instance {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }
    .instance.this-window {
      background: var(--card-active);
      border-color: var(--border-active);
    }
    .instance.offline { opacity: 0.65; }

    .instance-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neutral);
      flex-shrink: 0;
    }
    .dot.connected { background: var(--success); animation: pulse 2s infinite; }
    .host-badge {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--surface-alt, rgba(255,255,255,0.04));
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-muted);
    }
    .host-label { line-height: 1; }
    .host-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 3px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .instance-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .instance-name.unlabeled { color: var(--text-muted); font-style: italic; font-weight: 500; }
    .instance-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 16px;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .meta-sep { color: var(--border); margin: 0 5px; }
    .meta-tag { display: inline-block; color: var(--success); font-weight: 500; }
    .meta-tag.elsewhere { color: var(--warning); }
    .meta-tag.unassigned { color: var(--text-faint); }

    .btn-row { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text);
      border-color: var(--border);
      flex: 0 0 auto;
      padding: 7px 10px;
    }
    .btn-secondary:hover { background: #eef0f3; }
    .btn:disabled,
    .btn:disabled:hover {
      opacity: 0.55;
      cursor: not-allowed;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .empty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 14px 12px;
      text-align: center;
      background: var(--bg-subtle);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .empty-onboard {
      text-align: left;
      padding: 16px;
    }
    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      text-align: center;
    }
    .empty-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-align: center;
    }
    .empty-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-body {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      flex: 1;
    }
    .step-body code {
      display: block;
      margin-top: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 5px 8px;
      border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--accent);
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Chromeflow</div>
    <div class="status-pill idle" id="status-pill">
      <span class="pill-dot"></span>
      <span class="pill-text">No active sessions</span>
    </div>
  </div>

  <div id="groups"></div>
  <script src="popup.js"></script>
</body>
</html>
