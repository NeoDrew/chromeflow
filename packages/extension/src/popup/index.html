<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyclaw</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 16px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .logo-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .section-label {
      font-size: 11px;
      color: #6b6b6b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 6px;
    }

    .instance {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .instance-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.connected { background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .instance-port {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8e8;
    }
    .instance-status {
      font-size: 12px;
      color: #a3a3a3;
      margin-bottom: 8px;
    }
    .instance-status.assigned { color: #22c55e; }

    .btn {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
    }
    .btn-secondary {
      background: #2a2a2a;
      color: #a3a3a3;
      margin-top: 4px;
    }

    .empty {
      font-size: 12px;
      color: #6b6b6b;
      padding: 14px 12px;
      text-align: center;
      background: #1a1a1a;
      border: 1px dashed #2a2a2a;
      border-radius: 8px;
    }

    .hint {
      font-size: 11px;
      color: #6b6b6b;
      line-height: 1.5;
      border-top: 1px solid #1a1a1a;
      padding-top: 12px;
      margin-top: 12px;
    }
    .hint code {
      background: #1a1a1a;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 10px;
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-name">Keyclaw</div>
  </div>

  <div class="section-label">Claude Code instances</div>
  <div id="instances"></div>

  <div class="hint">
    Each Claude Code instance connects to a port (7878-7888). Assign a Chrome window to each so multiple instances can run automations in parallel.
  </div>
  <script src="popup.js"></script>
</body>
</html>
