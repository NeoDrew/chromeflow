<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromeflow</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --card: #ffffff;
      --card-active: #eff6ff;
      --border: #e5e7eb;
      --border-active: #bfdbfe;
      --text: #111827;
      --text-muted: #4b5563;
      --text-faint: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --neutral: #9ca3af;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .wordmark {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }
    .status-pill .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    .status-pill.idle .pill-dot { display: none; }

    .group { margin-bottom: 16px; }
    .group:last-of-type { margin-bottom: 0; }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      padding: 4px 0;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }
    .group-header.static { cursor: default; }
    .group-count {
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .group-toggle {
      display: inline-block;
      transition: transform 0.15s ease;
      margin-right: 4px;
      color: var(--text-faint);
    }
    .group.collapsed .group-toggle { transform: rotate(-90deg); }
    .group.collapsed .group-body { display: none; }

    .instance {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }
    .instance.this-window {
      background: var(--card-active);
      border-color: var(--border-active);
    }
    .instance.offline { opacity: 0.65; }

    .instance-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neutral);
      flex-shrink: 0;
    }
    .dot.connected { background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .instance-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .instance-name.unlabeled { color: var(--text-muted); font-style: italic; font-weight: 500; }
    .instance-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 16px;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .meta-sep { color: var(--border); margin: 0 5px; }
    .meta-tag { display: inline-block; color: var(--success); font-weight: 500; }
    .meta-tag.elsewhere { color: var(--warning); }
    .meta-tag.unassigned { color: var(--text-faint); }

    .btn-row { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text);
      border-color: var(--border);
      flex: 0 0 auto;
      padding: 7px 10px;
    }
    .btn-secondary:hover { background: #eef0f3; }

    .empty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 14px 12px;
      text-align: center;
      background: var(--bg-subtle);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.55;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 16px;
    }
    .hint code {
      background: var(--bg-subtle);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="wordmark">Chromeflow</div>
    <div class="status-pill idle" id="status-pill">
      <span class="pill-dot"></span>
      <span class="pill-text">No active sessions</span>
    </div>
  </div>

  <div id="groups"></div>

  <div class="hint">
    Each Claude Code session gets its own port (<code>7878-7888</code>). Assign one window per session for parallel automations.
  </div>
  <script src="popup.js"></script>
</body>
</html>
