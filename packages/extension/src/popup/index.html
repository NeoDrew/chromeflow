<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromeflow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 320px;
      background: #0f0f0f;
      color: #e8e8e8;
      padding: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .logo-icon {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .logo-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .group { margin-bottom: 14px; }
    .group:last-of-type { margin-bottom: 0; }
    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #6b6b6b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 4px 0;
      margin-bottom: 6px;
      cursor: pointer;
      user-select: none;
    }
    .group-header.static { cursor: default; }
    .group-count {
      background: #1a1a1a;
      color: #a3a3a3;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .group-toggle {
      display: inline-block;
      transition: transform 0.15s ease;
      margin-right: 4px;
    }
    .group.collapsed .group-toggle { transform: rotate(-90deg); }
    .group.collapsed .group-body { display: none; }

    .instance {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
    }
    .instance.this-window {
      border-color: #14532d;
      background: linear-gradient(180deg, #15291c 0%, #1a1a1a 100%);
    }
    .instance.offline { opacity: 0.6; }

    .instance-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b6b6b;
      flex-shrink: 0;
    }
    .dot.connected { background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .instance-name {
      font-size: 14px;
      font-weight: 600;
      color: #e8e8e8;
      letter-spacing: -0.2px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .instance-name.unlabeled { color: #a3a3a3; font-style: italic; font-weight: 500; }
    .instance-meta {
      font-size: 10px;
      color: #6b6b6b;
      margin-left: 16px;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }
    .meta-sep { color: #2a2a2a; margin: 0 5px; }
    .meta-tag {
      display: inline-block;
      color: #22c55e;
    }
    .meta-tag.elsewhere { color: #f59e0b; }
    .meta-tag.unassigned { color: #6b6b6b; }

    .btn-row { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
    }
    .btn-secondary {
      background: #2a2a2a;
      color: #a3a3a3;
      flex: 0 0 auto;
      padding: 6px 8px;
    }

    .empty {
      font-size: 12px;
      color: #6b6b6b;
      padding: 14px 12px;
      text-align: center;
      background: #1a1a1a;
      border: 1px dashed #2a2a2a;
      border-radius: 8px;
    }

    .hint {
      font-size: 11px;
      color: #6b6b6b;
      line-height: 1.5;
      border-top: 1px solid #1a1a1a;
      padding-top: 10px;
      margin-top: 14px;
    }
    .hint code {
      background: #1a1a1a;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 10px;
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-name">Chromeflow</div>
  </div>

  <div id="groups"></div>

  <div class="hint">
    Each Claude Code session gets its own port (<code>7878-7888</code>). Assign one window per session for parallel automations.
  </div>
  <script src="popup.js"></script>
</body>
</html>
