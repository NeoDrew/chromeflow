# GitLab CI: publish chromeflow to npm on push to main, when the publishable
# surface changes. Mirrors the prior GitHub Actions workflow.
#
# Auth to npm is via Trusted Publishing (OIDC) — configured on npmjs.com
# under chromeflow's package settings, pointing at this exact
# namespace/project/CI-file combination (NeoDrew/chromeflow/.gitlab-ci.yml).
# No NPM_TOKEN needed: npm CLI >= 11.5.1 auto-detects the NPM_ID_TOKEN below
# and exchanges it for a short-lived publish credential. Provenance is
# generated automatically as part of that exchange (no --provenance flag
# needed) but still needs SIGSTORE_ID_TOKEN for the actual attestation
# signing step, per npm's own GitLab CI example.
# https://docs.npmjs.com/trusted-publishers

stages:
  - publish

publish:
  stage: publish
  image: node:22
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - packages/mcp-server/**/*
        - packages/plugin/scripts/build-server.sh
        - CLAUDE.md
        - .gitlab-ci.yml
  script:
    # Trusted publishing needs npm CLI >= 11.5.1 — don't rely on whatever
    # version happens to ship in the node:22 image.
    - npm install -g npm@latest
    - npm --version

    # Install deps at repo root so the plugin's build-server.sh finds esbuild.
    # Use `npm install` (not `npm ci`) because nested package-lock files drift.
    # `npm rebuild` re-runs the platform-resolution for esbuild — without it the
    # `.bin/esbuild` shim ends up pointing at whatever-arch binary the lockfile
    # last linked (Linux runner died on the arm64 macOS binary).
    # GitLab runners share an npm cache that's been observed extracting only
    # root-level files of tarballs (SDK and ws lost their dist/ and lib/
    # subdirs). Clean cache + --prefer-online avoids that.
    - npm cache clean --force
    - rm -rf node_modules
    - npm install --prefer-online --no-audit --no-fund
    - ln -sf "$PWD/node_modules/@esbuild/linux-x64/bin/esbuild" node_modules/.bin/esbuild
    - test -f node_modules/@modelcontextprotocol/sdk/dist/esm/server/mcp.js || (echo "SDK dist/ STILL missing — npm extraction is broken at a deeper level"; ls node_modules/@modelcontextprotocol/sdk/; exit 1)

    # Bundle the MCP server and copy it into packages/mcp-server/bin/.
    - packages/plugin/scripts/build-server.sh
    - mkdir -p packages/mcp-server/bin
    - cp packages/plugin/server/chromeflow.mjs packages/mcp-server/bin/chromeflow.mjs
    - ls -lh packages/mcp-server/bin/chromeflow.mjs

    # Compare local version to what's on npm; only publish if newer.
    - cd packages/mcp-server
    - CURRENT=$(node -p "require('./package.json').version")
    - PUBLISHED=$(npm view chromeflow version 2>/dev/null || echo "0.0.0")
    - echo "current=$CURRENT"
    - echo "published=$PUBLISHED"
    - |
      if [ "$CURRENT" = "$PUBLISHED" ]; then
        echo "Version $CURRENT already published. Bump packages/mcp-server/package.json to release."
        exit 0
      fi
      echo "Will publish chromeflow@$CURRENT (npm has $PUBLISHED)"
      if [ -n "$NPM_ID_TOKEN" ]; then echo "NPM_ID_TOKEN present, length=${#NPM_ID_TOKEN}"; else echo "NPM_ID_TOKEN MISSING"; fi
      npm publish --access public
