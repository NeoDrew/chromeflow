name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-server/**'
      - 'packages/plugin/scripts/build-server.sh'
      - 'CLAUDE.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Install deps at repo root so the plugin's build-server.sh finds esbuild.
      # Use `npm install` rather than `npm ci` because the workspace's
      # nested package-lock files can drift; we just need esbuild + node deps
      # in place to bundle the MCP server.
      - name: Install repo-root deps
        run: npm install --ignore-scripts

      - name: Build the bundled MCP server
        run: |
          packages/plugin/scripts/build-server.sh
          mkdir -p packages/mcp-server/bin
          cp packages/plugin/server/chromeflow.mjs packages/mcp-server/bin/chromeflow.mjs
          ls -lh packages/mcp-server/bin/chromeflow.mjs

      - name: Check if version is unpublished
        id: check
        working-directory: packages/mcp-server
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view chromeflow version 2>/dev/null || echo "0.0.0")
          echo "current=$CURRENT"
          echo "published=$PUBLISHED"
          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Will publish chromeflow@$CURRENT (npm has $PUBLISHED)"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version $CURRENT already published — bump packages/mcp-server/package.json to release."
          fi

      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
